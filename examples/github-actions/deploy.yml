name: Build and Deploy

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version

            - name: Enable corepack
              run: corepack enable

            - name: Cache dependencies
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      .yarn/cache
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --immutable
              env:
                  CI: true

            # Lint, typecheck, test with coverage thresholds, then build into out/ (see Makefile).
            - name: Run CI checks and build
              run: make ci
              env:
                  CI: true

            - name: Create .nojekyll file
              run: touch out/.nojekyll

            # Uncomment and fill in to use a custom domain (or leave commented for the default github.io URL):
            # - name: Set custom domain
            #   run: echo "{{CNAME}}" > ./out/CNAME

            - name: Upload build artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with:
                  path: ./out

    deploy:
        # Only deploy on pushes to main/master — pull_request runs build-only to verify the change.
        if: github.event_name == 'push'
        needs: build
        runs-on: ubuntu-latest

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

            - name: Print deployment info
              run: echo "Site available at ${{ steps.deployment.outputs.page_url }}"
